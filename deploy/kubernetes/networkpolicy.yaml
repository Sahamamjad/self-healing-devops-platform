# Requires a CNI that implements NetworkPolicy (Calico, Cilium, etc.).
# On clusters without a policy-capable CNI this object is stored but not enforced.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: self-healing-platform
  namespace: self-healing
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: self-healing-platform
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
