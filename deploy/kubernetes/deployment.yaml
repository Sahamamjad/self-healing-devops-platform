apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-platform
  namespace: self-healing
  labels:
    app.kubernetes.io/name: self-healing-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: self-healing-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: self-healing-platform
    spec:
      serviceAccountName: self-healing-platform
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/example/self-healing-devops-platform:replace-with-commit-sha
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: self-healing-platform
          env:
            - name: REMEDIATION_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: self-healing-platform
                  key: REMEDIATION_AUTH_TOKEN
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 12
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: self-healing-data
        - name: tmp
          emptyDir: {}
