apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: self-healing-platform
  namespace: argocd
  finalizers: []
spec:
  project: default
  source:
    # No git remote exists in this workspace. Replace REPLACE_OWNER before registering the app.
    repoURL: https://github.com/REPLACE_OWNER/self-healing-devops-platform.git
    targetRevision: HEAD
    path: deploy/helm/self-healing-platform
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: self-healing
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
