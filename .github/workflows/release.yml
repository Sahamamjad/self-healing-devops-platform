name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Immutable image tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY}:sha-${GITHUB_SHA}"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
      - name: Build and push immutable tag
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.tags.outputs.tags }}
      - name: Record digest
        run: echo "Published digest ${{ steps.push.outputs.digest }}"
