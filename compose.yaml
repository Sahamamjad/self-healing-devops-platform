services:
  volume-init:
    image: busybox:1.37.0
    user: "0:0"
    command:
      - sh
      - -c
      - |
        mkdir -p /data /prometheus /grafana
        chown -R 10001:10001 /data
        chown -R 65534:65534 /prometheus
        chown -R 472:472 /grafana
    volumes:
      - app-data:/data
      - prometheus-data:/prometheus
      - grafana-data:/grafana
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: self-healing-devops-platform:local
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite+pysqlite:////data/app.sqlite
      DEMO_FAILURE_ENABLED: "false"
      REMEDIATION_DRY_RUN_ONLY: "true"
      AI_SUMMARIES_ENABLED: "false"
      HOME: /tmp
    volumes:
      - app-data:/data
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      volume-init:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-demo-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      volume-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  app-data:
  prometheus-data:
  grafana-data:
